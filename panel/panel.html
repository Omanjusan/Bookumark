<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Bookumark</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="system-menu-slot" class="two-bay-system-slot">
    <button id="system-menu-button" type="button" aria-label="システムメニューを開く">︙</button>
  </div>
  <nav id="system-menu" aria-label="システムメニュー" hidden>
    <button id="system-settings-entry" type="button">設定</button>
    <button id="system-bay-edit-entry" type="button" disabled>ベイ編集</button>
  </nav>
  <div class="frame">
    <header>
      <h1>Bookumark</h1>
      <span id="count"></span>
      <select id="layout-select" aria-label="名前付きレイアウト"></select>
      <button id="layout-default" type="button">デフォルトに戻す</button>
      <button id="layout-manage" type="button">レイアウト管理</button>
      <button id="layout-edit-entry" type="button" disabled>レイアウト編集</button>
      <small id="layout-edit-unavailable" class="layout-edit-unavailable" role="status" hidden></small>
      <button id="bay-factory-add" type="button">ベイを追加</button>
      <button id="bay-factory-entry" type="button">ベイを編集</button>
    </header>
    <div id="layout-edit-bar" class="layout-edit-bar" hidden>
      <strong id="layout-edit-name"></strong>
      <span id="layout-edit-unsaved" class="layout-edit-unsaved" hidden>未保存</span>
      <button id="layout-edit-undo" type="button" disabled>元に戻す</button>
      <button id="layout-edit-redo" type="button" disabled>やり直す</button>
      <button id="layout-edit-save" type="button" disabled>保存</button>
      <button id="layout-edit-retry" type="button" hidden>保存を再試行</button>
      <button id="layout-edit-delete" type="button">削除</button>
      <button id="layout-edit-exit" type="button">編集を終了</button>
      <span id="layout-edit-status" role="status" aria-live="polite"></span>
    </div>
    <section
      id="layout-edit-discard-confirmation"
      class="layout-edit-discard-confirmation"
      role="alertdialog"
      aria-labelledby="layout-edit-discard-title"
      hidden
    >
      <p id="layout-edit-discard-title">未保存の変更があります</p>
      <div>
        <button id="layout-edit-continue" type="button">編集を続ける</button>
        <button id="layout-edit-discard" type="button">変更を破棄</button>
      </div>
    </section>
    <section id="bay-picker" class="bay-picker" aria-label="ベイピッカー" hidden>
      <section class="bay-picker-section" aria-labelledby="bay-picker-unplaced-title">
        <h2 id="bay-picker-unplaced-title">未配置</h2>
        <div id="bay-picker-unplaced" class="bay-picker-row"></div>
      </section>
      <section class="bay-picker-section" aria-labelledby="bay-picker-placed-title">
        <h2 id="bay-picker-placed-title">配置済み</h2>
        <div id="bay-picker-placed" class="bay-picker-row"></div>
      </section>
    </section>
    <div id="bay-factory-selection" class="bay-factory-selection" hidden>
      <select id="bay-factory-select" aria-label="編集するベイ">
        <option value="">編集するベイを選択</option>
      </select>
      <button id="bay-factory-open" type="button" disabled>選択したベイを編集</button>
    </div>
    <div id="docking-grid" class="docking-grid">
    <div id="docking-rail-top" class="dock-rail dock-rail--top" aria-label="上レール"></div>
    <div id="docking-rail-left" class="dock-rail dock-rail--left" aria-label="左レール"></div>
    <div id="docking-center" class="docking-center">
    <section id="two-bay-edit-canvas" class="two-bay-edit-scroll" aria-label="ベイ構成編集" hidden>
      <div class="two-bay-edit-canvas">
        <section id="two-bay-chip-toolbox" aria-label="チップツールボックス"></section>
        <div id="two-bay-chip-removal" aria-label="チップ除去領域">ここへドロップしてチップを除去</div>
        <footer class="two-bay-edit-footer">
          <button id="two-bay-edit-confirm" type="button" disabled>確定</button>
          <button id="two-bay-edit-retry" type="button" hidden>保存を再試行</button>
          <button id="two-bay-edit-cancel" type="button">キャンセル</button>
          <span id="two-bay-edit-status" role="status" aria-live="polite"></span>
        </footer>
      </div>
    </section>
    <nav id="folders" class="folder-region" aria-label="フォルダ" hidden></nav>
    <div
      id="official-move-notice"
      class="official-move-notice"
      role="status"
      aria-live="polite"
      hidden
    >
      <span id="official-move-message"></span>
      <button id="official-move-undo" type="button">元に戻す</button>
    </div>
    <main id="app">
      <p class="status">読み込み中…</p>
    </main>
    </div>
    <div
      id="layout-bay-trash"
      class="layout-bay-trash"
      aria-label="ベイを未配置にする"
      hidden
    >中央ゴミ箱へドロップして未配置にする</div>
    <div id="docking-rail-right" class="dock-rail dock-rail--right" aria-label="右レール"></div>
    <footer id="docking-rail-bottom" class="panel-tools dock-rail dock-rail--bottom" aria-label="下レール"></footer>
    </div>
  </div>
  <section
    id="panel-flavor-picker"
    class="panel-flavor-picker"
    role="dialog"
    aria-modal="false"
    aria-labelledby="panel-flavor-picker-title"
    hidden
  >
    <header>
      <strong id="panel-flavor-picker-title"></strong>
      <button id="panel-flavor-picker-close" type="button" aria-label="配色選択を閉じる">×</button>
    </header>
    <div
      id="panel-flavor-picker-choices"
      class="panel-flavor-picker-choices"
      role="radiogroup"
      aria-label="パネル配色"
    ></div>
  </section>
  <dialog
    id="list-date-settings"
    class="list-date-settings"
    aria-labelledby="list-date-settings-title"
  >
    <header>
      <strong id="list-date-settings-title">一覧の日付表示設定</strong>
      <button id="list-date-settings-close" type="button" aria-label="一覧の日付表示設定を閉じる">×</button>
    </header>
    <label for="list-date-format">日付表示方式</label>
    <select id="list-date-format">
      <option value="browser">ブラウザー設定</option>
      <option value="iso">ISO（2026-08-03 14:05）</option>
      <option value="ja-JP">日本</option>
      <option value="en-US">米国</option>
      <option value="en-GB">英国</option>
      <option value="de-DE">欧州</option>
    </select>
    <span id="list-date-settings-status" role="status" aria-live="polite"></span>
  </dialog>
  <dialog id="two-bay-settings-dialog" aria-labelledby="two-bay-settings-title">
    <div class="two-bay-settings-heading">
      <h2 id="two-bay-settings-title">設定</h2>
      <button id="two-bay-settings-close" type="button" aria-label="設定を閉じる">×</button>
    </div>
    <fieldset>
      <legend>システムベイ</legend>
      <label><input id="system-bay-top" type="radio" name="system-bay" value="top"> 上ベイ</label>
      <label><input id="system-bay-bottom" type="radio" name="system-bay" value="bottom"> 下ベイ</label>
    </fieldset>
    <div class="two-bay-settings-recovery">
      <button id="system-bay-retry" type="button" hidden>保存を再試行</button>
      <button id="system-bay-cancel" type="button" hidden>変更を取り消す</button>
      <span id="system-bay-status" role="status" aria-live="polite"></span>
    </div>
    <button id="two-bay-reset" type="button">ベイ状態を初期値に戻す</button>
  </dialog>
  <dialog id="two-bay-reset-dialog" aria-labelledby="two-bay-reset-title">
    <h2 id="two-bay-reset-title">ベイ状態を初期値に戻しますか？</h2>
    <p>上下ベイの行数、チップ構成、チップ固有設定を初期化します。</p>
    <div class="two-bay-reset-actions">
      <button id="two-bay-reset-confirm" type="button">初期値に戻す</button>
      <button id="two-bay-reset-retry" type="button" hidden>保存を再試行</button>
      <button id="two-bay-reset-dismiss" type="button">キャンセル</button>
      <span id="two-bay-reset-status" role="status" aria-live="polite"></span>
    </div>
  </dialog>
  <dialog id="layout-dialog" class="layout-dialog" aria-labelledby="layout-dialog-title">
    <div class="layout-dialog-heading">
      <h2 id="layout-dialog-title">レイアウト管理</h2>
      <button id="layout-dialog-close" type="button" aria-label="レイアウト管理を閉じる">×</button>
    </div>
    <label>名前 <input id="layout-name" type="text" autocomplete="off"></label>
    <label>複製元
      <select id="layout-source">
        <option value="">空白から作成</option>
      </select>
    </label>
    <fieldset id="layout-duplication-modes">
      <legend>ベイの扱い</legend>
      <label><input id="layout-duplication-shared" type="radio" name="layout-duplication" value="shared" checked> 同じベイを使用</label>
      <small>ベイの編集内容が両方のレイアウトに反映されます</small>
      <label><input id="layout-duplication-independent" type="radio" name="layout-duplication" value="independent"> ベイも複製</label>
      <small>新しいレイアウト専用のベイとして編集できます</small>
    </fieldset>
    <div class="layout-dialog-actions">
      <button id="layout-create" type="button">新規作成</button>
      <button id="layout-rename" type="button">名前変更</button>
      <button id="layout-preferred" type="button">既定にする</button>
      <button id="layout-delete" type="button">削除</button>
      <button id="layout-retry" type="button" hidden>保存を再試行</button>
    </div>
    <p id="layout-status" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="bay-factory-dialog" class="bay-factory-dialog" aria-labelledby="bay-factory-title">
    <div class="bay-factory-heading">
      <h2 id="bay-factory-title">ベイ工場</h2>
      <button
        id="bay-factory-close"
        type="button"
        aria-label="ベイ工場を閉じる"
        title="ベイ工場を閉じる"
      >×</button>
    </div>
    <div id="bay-factory-menu" class="bay-factory-menu">
      <input
        id="bay-factory-name"
        type="text"
        aria-label="ベイ名"
        placeholder="ベイ名"
        disabled
      >
      <select id="bay-factory-placement" aria-label="新規ベイの追加先" hidden disabled>
        <option value="top">上</option>
        <option value="right">右</option>
        <option value="bottom">下</option>
        <option value="left">左</option>
      </select>
      <button id="bay-factory-undo" type="button" disabled>元に戻す</button>
      <button id="bay-factory-redo" type="button" disabled>やり直す</button>
      <button id="bay-factory-save" type="button" disabled>保存</button>
      <button id="bay-factory-duplicate" type="button" disabled>複製</button>
      <button id="bay-factory-delete" type="button" disabled>削除</button>
      <span id="bay-factory-save-status" role="status" aria-live="polite"></span>
    </div>
    <div id="bay-factory-workspace" class="bay-factory-workspace">
      <aside id="bay-factory-tools" class="bay-factory-tools" aria-label="チップツール">
        <div id="chip-tool-list"></div>
      </aside>
      <div id="chip-tool-tooltip" class="chip-tool-tooltip" role="tooltip" hidden>
        <strong id="chip-tool-tooltip-title"></strong>
        <span id="chip-tool-tooltip-description"></span>
      </div>
      <section
        id="bay-factory-editor"
        class="bay-factory-editor"
        aria-label="横ベイ編集領域"
      ></section>
    </div>
    <section id="bay-factory-management-status" class="bay-factory-management-status" hidden>
      <p id="bay-factory-management-message"></p>
    </section>
    <section
      id="bay-factory-discard-confirmation"
      class="bay-factory-discard-confirmation"
      role="alertdialog"
      aria-labelledby="bay-factory-discard-title"
      hidden
    >
      <p id="bay-factory-discard-title">未保存の変更があります</p>
      <div>
        <button id="bay-factory-continue-editing" type="button">編集を続ける</button>
        <button id="bay-factory-discard-changes" type="button">変更を破棄</button>
      </div>
    </section>
  </dialog>
  <dialog
    id="common-notification-dialog"
    class="common-notification-dialog"
    aria-labelledby="common-notification-title"
    aria-describedby="common-notification-message"
  >
    <h2 id="common-notification-title"></h2>
    <p id="common-notification-message" class="common-notification-message"></p>
    <p id="common-notification-busy" role="status" hidden>処理中…</p>
    <button id="common-notification-primary" type="button"></button>
  </dialog>
  <section
    id="common-toast-region"
    class="common-toast-region"
    role="status"
    aria-live="polite"
    aria-atomic="false"
  ></section>
  <script type="module" src="panel.js"></script>
</body>
</html>
