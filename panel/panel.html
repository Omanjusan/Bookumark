<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Bookumark</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="frame">
    <header>
      <h1>Bookumark</h1>
      <span id="count"></span>
      <button id="bay-factory-add" type="button">ベイを追加</button>
      <button id="bay-factory-entry" type="button">ベイを編集</button>
    </header>
    <div id="bay-factory-selection" class="bay-factory-selection" hidden>
      <select id="bay-factory-select" aria-label="編集するベイ">
        <option value="">編集するベイを選択</option>
      </select>
      <button id="bay-factory-open" type="button" disabled>選択したベイを編集</button>
    </div>
    <div class="dock-rail dock-rail--top" aria-label="上レール">
      <section class="dock-bay dock-bay--search" aria-label="検索ベイ">
        <input
          id="search"
          type="search"
          aria-label="ブックマークを検索"
          placeholder="ブックマークを検索"
          autocomplete="off"
        >
      </section>
      <section class="dock-bay dock-bay--filter" aria-label="訪問状態フィルタベイ">
        <fieldset id="visit-status-filter" class="visit-status-filter">
          <legend>訪問状態</legend>
          <div class="visit-status-options">
            <label class="visit-status-option">
              <input type="radio" name="visit-status" value="all" checked>
              <span>すべて</span>
            </label>
            <label class="visit-status-option">
              <input type="radio" name="visit-status" value="visited">
              <span>訪問あり</span>
            </label>
            <label class="visit-status-option">
              <input type="radio" name="visit-status" value="unvisited">
              <span>未訪問</span>
            </label>
          </div>
        </fieldset>
      </section>
    </div>
    <nav id="folders" class="folder-region" aria-label="フォルダ" hidden></nav>
    <div
      id="official-move-notice"
      class="official-move-notice"
      role="status"
      aria-live="polite"
      hidden
    >
      <span id="official-move-message"></span>
      <button id="official-move-undo" type="button">元に戻す</button>
    </div>
    <main id="app">
      <p class="status">読み込み中…</p>
    </main>
    <footer class="panel-tools dock-rail dock-rail--bottom" aria-label="下レール">
      <section class="dock-bay dock-bay--history" aria-label="フォルダ履歴ベイ">
        <div class="folder-navigation" role="group" aria-label="フォルダ履歴">
          <button
            id="folder-back"
            type="button"
            aria-label="前のフォルダへ戻る"
            title="前のフォルダへ戻る"
            disabled
          >&lt;</button>
          <button
            id="folder-forward"
            type="button"
            aria-label="次のフォルダへ進む"
            title="次のフォルダへ進む"
            disabled
          >&gt;</button>
        </div>
      </section>
      <section class="dock-bay dock-bay--sort" aria-label="ソートベイ">
        <label>
          並び順
          <select id="sort-axis" aria-label="並び順">
            <option value="title">タイトル</option>
            <option value="dateAdded">追加日時</option>
            <option value="visitCount" selected>訪問回数</option>
            <option value="lastVisitTime">最終訪問日時</option>
          </select>
        </label>
        <button
          id="sort-direction"
          type="button"
          data-direction="desc"
          aria-label="並び方向を切り替え"
        >降順</button>
      </section>
      <section class="dock-bay dock-bay--view" aria-label="表示形式ベイ">
        <fieldset id="view-type" class="view-type">
          <legend>表示形式</legend>
          <div class="view-type-options">
            <label class="view-type-option">
              <input type="radio" name="view-type" value="panel" checked>
              <span>パネル</span>
            </label>
            <label class="view-type-option">
              <input type="radio" name="view-type" value="icon">
              <span>アイコン</span>
            </label>
            <label class="view-type-option">
              <input type="radio" name="view-type" value="card">
              <span>カード</span>
            </label>
            <label class="view-type-option">
              <input type="radio" name="view-type" value="list">
              <span>一覧</span>
            </label>
          </div>
        </fieldset>
      </section>
      <section class="dock-bay dock-bay--movement" aria-label="移動モードベイ">
        <fieldset
          id="movement-mode"
          class="movement-mode"
          aria-describedby="movement-mode-note"
        >
          <legend>移動モード</legend>
          <div class="movement-mode-options">
            <label class="movement-option movement-option--custom">
              <input type="radio" name="movement-mode" value="custom-order">
              <span class="movement-segment">カスタム配置</span>
            </label>
            <label class="movement-option movement-option--normal">
              <input type="radio" name="movement-mode" value="normal" checked>
              <span class="movement-segment">通常</span>
            </label>
            <label class="movement-option movement-option--directory">
              <input type="radio" name="movement-mode" value="directory-move">
              <span class="movement-segment">公式整理</span>
            </label>
          </div>
          <span id="movement-mode-note" class="movement-mode-note">公式整理はFirefox本体へ反映</span>
        </fieldset>
      </section>
    </footer>
  </div>
  <dialog id="bay-factory-dialog" class="bay-factory-dialog" aria-labelledby="bay-factory-title">
    <div class="bay-factory-heading">
      <h2 id="bay-factory-title">ベイ工場</h2>
      <button
        id="bay-factory-close"
        type="button"
        aria-label="ベイ工場を閉じる"
        title="ベイ工場を閉じる"
      >×</button>
    </div>
    <div id="bay-factory-menu" class="bay-factory-menu">
      <input
        id="bay-factory-name"
        type="text"
        aria-label="ベイ名"
        placeholder="ベイ名"
        disabled
      >
      <button id="bay-factory-undo" type="button" disabled>元に戻す</button>
      <button id="bay-factory-redo" type="button" disabled>やり直す</button>
      <button id="bay-factory-save" type="button" disabled>保存</button>
      <button id="bay-factory-duplicate" type="button" disabled>複製</button>
      <button id="bay-factory-delete" type="button" disabled>削除</button>
    </div>
    <div id="bay-factory-workspace" class="bay-factory-workspace">
      <aside id="bay-factory-tools" class="bay-factory-tools" aria-label="チップツール">
        <div id="chip-tool-list"></div>
      </aside>
      <div id="chip-tool-tooltip" class="chip-tool-tooltip" role="tooltip" hidden>
        <strong id="chip-tool-tooltip-title"></strong>
        <span id="chip-tool-tooltip-description"></span>
      </div>
      <section
        id="bay-factory-editor"
        class="bay-factory-editor"
        aria-label="横ベイ編集領域"
      ></section>
    </div>
    <section id="bay-factory-management-status" class="bay-factory-management-status" hidden>
      <p id="bay-factory-management-message"></p>
    </section>
    <section
      id="bay-factory-discard-confirmation"
      class="bay-factory-discard-confirmation"
      role="alertdialog"
      aria-labelledby="bay-factory-discard-title"
      hidden
    >
      <p id="bay-factory-discard-title">未保存の変更があります</p>
      <div>
        <button id="bay-factory-continue-editing" type="button">編集を続ける</button>
        <button id="bay-factory-discard-changes" type="button">変更を破棄</button>
      </div>
    </section>
  </dialog>
  <script type="module" src="panel.js"></script>
</body>
</html>
